<svg xmlns="http://www.w3.org/2000/svg" width="900" height="414" viewBox="140 50 620 285" role="img" aria-labelledby="title desc">
  <title id="title">DocAI 文档工作台界面示意</title>
  <desc id="desc">原创示意图，以空白资料行演示资料库、上传和提问入口，不含真实文件或用户数据。</desc>
  <g font-family="Arial, PingFang SC, sans-serif">
    <rect x="150" y="64" width="600" height="260" rx="4" fill="white"/>
    <path d="M150 107H750M290 107V324" fill="none" stroke="#e8ebef"/>
    <text x="174" y="92" font-size="15" font-weight="600" fill="#303740">DocAI</text>
    <text x="314" y="91" font-size="10" fill="#85909d">AI 文档工作台</text>
    <rect x="166" y="123" width="107" height="27" rx="3" fill="#303740"/>
    <text x="184" y="141" font-size="10" fill="white">＋ 开始对话</text>
    <text x="174" y="178" font-size="10" fill="#85909d">资料库</text>
    <g fill="#f5f6f8" stroke="#e7ebef"><rect x="166" y="190" width="107" height="28" rx="3"/><rect x="166" y="228" width="107" height="28" rx="3"/></g>
    <g stroke="#a7afb8" stroke-width="2"><path d="M179 204h65M179 242h49"/></g>
    <text x="320" y="150" font-size="22" font-weight="500" fill="#303740">让资料，变成答案。</text>
    <rect x="319" y="171" width="403" height="86" rx="4" fill="white" stroke="#e3e7eb"/>
    <text x="335" y="194" font-size="11" fill="#8a949f">问一个问题，或上传文件开始…</text>
    <text x="335" y="241" font-size="10" fill="#66717e">＋ 上传资料</text>
    <rect x="685" y="225" width="23" height="23" rx="4" fill="#303740"/>
    <path d="M696.5 242v-11m-4 4 4-4 4 4" fill="none" stroke="white" stroke-width="1.4"/>
    <g fill="#f7f8fa" stroke="#e7ebef"><rect x="319" y="270" width="193" height="30" rx="3"/><rect x="528" y="270" width="194" height="30" rx="3"/></g>
    <g font-size="10" fill="#788694"><text x="336" y="289">上传文档，提炼重点</text><text x="546" y="289">查询资料，核对来源</text></g>
  </g>
